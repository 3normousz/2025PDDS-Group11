<div class="flex flex-wrap justify-center gap-4 mt-2">
  <!-- Education Level Dropdown (moved first) -->
  <div class="relative inline-block text-left">
    <button
      type="button"
      id="edu-btn"
      onclick="toggleDropdown('edu-dropdown')"
      class="inline-flex justify-between items-center w-56 px-4 py-1 bg-[#0a015b] border border-white text-white font-bold text-sm lg:[@media(min-height:800px)]:text-base uppercase tracking-wider hover:bg-white/10 focus:outline-none"
    >
      <span class="truncate" id="edu-btn-text"
        >All levels of higher edu. attainment</span
      >
      <svg
        class="-mr-1 ml-2 h-5 w-5 fill-current text-[#bb99ff] shrink-0"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 20 20"
      >
        <path
          fill-rule="evenodd"
          d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z"
          clip-rule="evenodd"
        />
      </svg>
    </button>
    <div
      id="edu-dropdown"
      class="hidden absolute left-0 mt-1 w-56 bg-[#0a015b] border border-white shadow-lg z-50 text-white"
    >
      <div class="py-1 max-h-60 overflow-y-auto" id="edu-list">
        <!-- Education levels will be here -->
      </div>
    </div>
  </div>

  <!-- Region Dropdown -->
  <div class="relative inline-block text-left">
    <button
      type="button"
      id="region-btn"
      onclick="toggleDropdown('region-dropdown')"
      class="inline-flex justify-between items-center w-40 px-4 py-1 bg-[#0a015b] border border-white text-white font-bold text-sm lg:[@media(min-height:800px)]:text-base uppercase tracking-wider hover:bg-white/10 focus:outline-none"
    >
      <span class="truncate" id="region-btn-text">Region</span>
      <!-- Dropdown Arrow -->
      <svg
        class="-mr-1 ml-2 h-5 w-5 fill-current text-[#bb99ff] shrink-0"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 20 20"
      >
        <path
          fill-rule="evenodd"
          d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z"
          clip-rule="evenodd"
        />
      </svg>
    </button>
    <div
      id="region-dropdown"
      class="hidden absolute left-0 mt-1 w-40 bg-[#0a015b] border border-white shadow-lg z-50 text-white"
    >
      <div class="py-1 max-h-60 overflow-y-auto" id="region-list">
        <!-- Regions will be populated here -->
      </div>
    </div>
  </div>

  <!-- Country Dropdown -->
  <div class="relative inline-block text-left">
    <button
      type="button"
      id="country-btn"
      onclick="toggleDropdown('country-dropdown')"
      class="inline-flex justify-between items-center w-40 px-4 py-1 bg-[#0a015b] border border-white text-white font-bold text-sm lg:[@media(min-height:800px)]:text-base uppercase tracking-wider hover:bg-white/10 focus:outline-none"
    >
      <span class="truncate" id="country-btn-text">Country</span>
      <!-- Dropdown Arrow -->
      <svg
        class="-mr-1 ml-2 h-5 w-5 fill-current text-[#bb99ff] shrink-0"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 20 20"
      >
        <path
          fill-rule="evenodd"
          d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z"
          clip-rule="evenodd"
        />
      </svg>
    </button>
    <div
      id="country-dropdown"
      class="hidden absolute left-0 mt-1 w-40 bg-[#0a015b] border border-white shadow-lg z-50 text-white"
    >
      <div class="py-1 max-h-60 overflow-y-auto" id="country-list">
        <!-- Countries will be populated here -->
      </div>
    </div>
  </div>
</div>

<script>
  // Global state
  window.currentRegion = "All Regions";
  window.currentCountry = "All Countries";
  window.currentEduLevel = "All Levels";

  function toggleDropdown(id) {
    const dropdown = document.getElementById(id);
    const isHidden = dropdown.classList.contains("hidden");

    // Close all dropdowns first
    document.getElementById("region-dropdown").classList.add("hidden");
    document.getElementById("country-dropdown").classList.add("hidden");
    document.getElementById("edu-dropdown").classList.add("hidden");

    if (isHidden) {
      dropdown.classList.remove("hidden");
    }
  }

  // Close dropdowns when clicking outside
  window.addEventListener("click", function (e) {
    if (!e.target.closest(".relative")) {
      document.getElementById("region-dropdown").classList.add("hidden");
      document.getElementById("country-dropdown").classList.add("hidden");
      document.getElementById("edu-dropdown").classList.add("hidden");
    }
  });

  function selectRegion(region) {
    window.currentRegion = region;
    document.getElementById("region-btn-text").textContent =
      region === "All Regions" ? "Region" : region;
    document.getElementById("region-dropdown").classList.add("hidden");

    // Reset country when region changes
    window.currentCountry = "All Countries";
    document.getElementById("country-btn-text").textContent = "Country";

    updateCharts();
    fetchCountries(region);
  }

  function selectCountry(country) {
    window.currentCountry = country;
    document.getElementById("country-btn-text").textContent =
      country === "All Countries" ? "Country" : country;
    document.getElementById("country-dropdown").classList.add("hidden");

    // Reset Education Level to "All Levels" if a specific country is selected
    // This prevents the chart from going empty if the country's edu level doesn't match the filter
    if (country !== "All Countries") {
      window.currentEduLevel = "All Levels";
      document.getElementById("edu-btn-text").textContent =
        "All levels of higher edu. attainment";
    }

    updateCharts();
  }

  function selectEduLevel(label) {
    // If a specific country is selected, force "All Levels" regardless of selection
    if (window.currentCountry && window.currentCountry !== "All Countries") {
      window.currentEduLevel = "All Levels";
      document.getElementById("edu-btn-text").textContent =
        "All levels of higher edu. attainment";
      document.getElementById("edu-dropdown").classList.add("hidden");
      updateCharts();
      return;
    }

    // Map visible label to internal value expected by APIs
    let value = "All Levels";
    const lowerLabel = label ? label.toLowerCase() : "";

    if (lowerLabel.startsWith("all")) {
      value = "All Levels";
    } else if (lowerLabel.startsWith("low")) {
      value = "Low";
    } else if (lowerLabel.startsWith("medium")) {
      value = "Medium";
    } else if (lowerLabel.startsWith("high")) {
      value = "High";
    }

    window.currentEduLevel = value;
    // Show the full phrase on the button
    document.getElementById("edu-btn-text").textContent = label;
    document.getElementById("edu-dropdown").classList.add("hidden");

    // Debug logging to help verify frontend behavior
    try {
      console.log("selectEduLevel -> label:", label, "mapped:", value);
    } catch (e) {}

    updateCharts();
  }

  function updateCharts() {
    // Only update the 3rd (Gender Diff) graph
    // The user requested that the 4th graph (Edu Residence) should NOT be affected by this filter.

    // 3rd Graph: Gender Diff
    if (window.updateGenderChart) {
      window.updateGenderChart(
        window.currentRegion,
        window.currentCountry,
        window.currentEduLevel || "All Levels"
      );
    }

    // 4th Graph: Edu Residence Chart
    // We still update it for Region/Country changes, but we pass "All Levels" for the edu filter
    // to ensure it ignores the education attainment filter as requested.
    if (window.updateEduResidenceChart) {
      window.updateEduResidenceChart(
        window.currentRegion,
        window.currentCountry,
        "All Levels"
      );
    }
  }

  function fetchRegions() {
    fetch("/api/regions")
      .then((res) => res.json())
      .then((data) => {
        const list = document.getElementById("region-list");
        list.innerHTML = "";

        addOption(list, "All Regions", selectRegion);

        data.forEach((region) => {
          addOption(list, region, selectRegion);
        });
      })
      .catch((err) => {
        console.log("Using mock regions for now");
        const list = document.getElementById("region-list");
        const mockRegions = ["Africa", "Asia", "Europe", "Americas", "Oceania"];
        addOption(list, "All Regions", selectRegion);
        mockRegions.forEach((r) => addOption(list, r, selectRegion));
      });
  }

  function fetchCountries(region) {
    let url = "/api/countries";
    if (region && region !== "All Regions") {
      url += `?region=${encodeURIComponent(region)}`;
    }

    fetch(url)
      .then((res) => res.json())
      .then((data) => {
        const list = document.getElementById("country-list");
        list.innerHTML = "";

        addOption(list, "All Countries", selectCountry);

        data.forEach((country) => {
          addOption(list, country, selectCountry);
        });
      })
      .catch((err) => {
        console.log("Using mock countries");
        const list = document.getElementById("country-list");
        list.innerHTML = "";
        addOption(list, "All Countries", selectCountry);
        // Mock data for handling errors in fetching
        ["Afghanistan", "Albania", "Algeria"].forEach((c) =>
          addOption(list, c, selectCountry)
        );
      });
  }

  function addOption(parent, text, callback) {
    const div = document.createElement("div");
    div.className = "px-4 py-2 hover:bg-white/20 cursor-pointer text-sm";
    div.textContent = text;
    div.onclick = () => callback(text);
    parent.appendChild(div);
  }

  document.addEventListener("DOMContentLoaded", function () {
    fetchRegions();
    fetchCountries();
    // Populate education levels (visible phrases)
    const eduList = document.getElementById("edu-list");
    eduList.innerHTML = "";
    addOption(eduList, "All levels of higher edu. attainment", selectEduLevel);
    addOption(eduList, "Low level of higher edu. attainment", selectEduLevel);
    addOption(
      eduList,
      "Medium level of higher edu. attainment",
      selectEduLevel
    );
    addOption(eduList, "High level of higher edu. attainment", selectEduLevel);

    // init global (internal value)
    window.currentEduLevel = "All Levels";
  });
</script>
