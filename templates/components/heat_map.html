<style>
  .country {
    vector-effect: non-scaling-stroke;
  }
</style>
<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3-geo-projection@4"></script>

<div class="h-full w-full">
  <div class="bg-white p-4 font-glacial w-full h-full flex flex-col lg:flex-row gap-4">
    <!-- What happen? Section -->
    <div class="w-full lg:w-1/4 flex flex-col justify-center min-w-0">
    <h2 class="text-2xl md:text-2xl lg:[@media(min-height:800px)]:text-4xl font-bold mb-2 lg:mb-2 leading-tight">What<br>happen?</h2>
        <p class="text-xs md:text-base lg:[@media(min-height:800px)]:text-base italic text-gray-700">
            Violence acceptance rate is the percentage of people who say that hitting or beating a wife is acceptable in at least one situation.
        </p>
    </div>

    <!-- Map Section -->
    <div class="flex-1 flex flex-col min-w-0">
        <div class="flex-none mb-2 pb-2">
            <h2 class="text-center text-base font-bold text-black uppercase tracking-wider">
                WORLDMAP VIOLENCE ACCEPTANCE RATE
            </h2>
        </div>
        <div class="flex-1 min-h-0 relative flex flex-row">
            <div id="worldHeatmap" class="flex-1 h-full relative min-h-0">
                <div class="absolute top-2 right-2 flex flex-col gap-1 z-10">
                <button
                    class="w-6 h-6 bg-white border border-gray-300 rounded cursor-pointer flex items-center justify-center font-bold shadow-md hover:bg-gray-100 hover:shadow-lg transition-all text-sm"
                    id="zoom-in"
                    title="Zoom in"
                >
                    +
                </button>
                <button
                    class="w-6 h-6 bg-white border border-gray-300 rounded cursor-pointer flex items-center justify-center font-bold shadow-md hover:bg-gray-100 hover:shadow-lg transition-all text-sm"
                    id="zoom-out"
                    title="Zoom out"
                >
                    -
                </button>
                <button
                    class="w-6 h-6 bg-white border border-gray-300 rounded cursor-pointer flex items-center justify-center font-bold shadow-md hover:bg-gray-100 hover:shadow-lg transition-all text-sm"
                    id="zoom-reset"
                    title="Reset zoom"
                >
                    ⟲
                </button>
                </div>
            </div>
            <div class="flex-none flex flex-row items-center justify-center ml-2 h-full py-12">
                <div class="flex flex-col justify-between h-full text-xs text-gray-600 mr-2 text-right font-bold">
                    <span>50%</span>
                    <span>40%</span>
                    <span>30%</span>
                    <span>20%</span>
                    <span>10%</span>
                    <span>0%</span>
                </div>
                <div
                class="w-4 h-full rounded border border-gray-200"
                style="
                    background: linear-gradient(
                    to bottom,
                    #0a015b,
                    #7303c0,
                    #ec38bc,
                    #fdeff9
                    );
                "
                ></div>
            </div>
        </div>
    </div>
  </div>
</div>

<div
  class="absolute px-3 py-2 bg-black/80 text-white rounded pointer-events-none text-sm opacity-0 transition-opacity"
  id="tooltip"
></div>

<script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>
<script src="/static/js/heatmap.js"></script>
