<script>
  document.addEventListener("DOMContentLoaded", function () {
    // const reasonSelect = document.getElementById("reason-select");
    const maleRect = document.getElementById("male-fill-rect");
    const femaleRect = document.getElementById("female-fill-rect");
    const maleText = document.getElementById("male-percentage-text");
    const femaleText = document.getElementById("female-percentage-text");
    const analysisText = document.getElementById("analysis-text");

    let chartData = {};
    // Hardcoded reason as requested
    const TARGET_REASON = "... for at least one specific reason";

    // Initial fetch
    fetchGenderData();

    // Listen for custom event from dropdowns.html
    // reasonSelect.addEventListener("change", function (e) {
    //     if (chartData[this.value]) {
    //         updateChart(this.value);
    //     }
    // });

    // Expose update function
    window.updateGenderChart = function (region, country) {
      fetchGenderData(region, country);
    };

    function fetchGenderData(region, country) {
      let url = "/api/reason-gender";
      const params = new URLSearchParams();
      if (region && region !== "All Regions") params.append("region", region);
      if (country && country !== "All Countries")
        params.append("country", country);

      if (params.toString()) url += "?" + params.toString();

      fetch(url)
        .then((response) => response.json())
        .then((data) => {
          chartData = data;

          // Always use the target reason
          if (data[TARGET_REASON]) {
            updateChart(TARGET_REASON);
          } else {
            // Fallback if exact string match fails (e.g. different spacing)
            const key = Object.keys(data).find((k) =>
              k.includes("at least one specific reason")
            );
            if (key) {
              updateChart(key);
            } else {
              // Fallback to first key
              const firstReason = Object.keys(data)[0];
              if (firstReason) updateChart(firstReason);
            }
          }
        })
        .catch((error) => {
          console.error("Error fetching data:", error);
          analysisText.textContent = "Error loading data.";
        });
    }

    // function populateDropdown(data) { ... } // Removed as dropdown is hidden

    function updateChart(reason) {
      const data = chartData[reason];
      if (!data) return;

      const maleVal = data.M || 0;
      const femaleVal = data.F || 0;

      // Update Male Head
      const maleHeight = (375 * maleVal) / 100;
      const maleY = 375 - maleHeight;

      maleRect.setAttribute("height", maleHeight);
      maleRect.setAttribute("y", maleY);
      maleText.textContent = Math.round(maleVal) + "%";

      // Update Female Head
      const femaleHeight = (375 * femaleVal) / 100;
      const femaleY = 375 - femaleHeight;

      femaleRect.setAttribute("height", femaleHeight);
      femaleRect.setAttribute("y", femaleY);
      femaleText.textContent = Math.round(femaleVal) + "%";

      // Calculate difference
      const diff = Math.round(femaleVal - maleVal);
      let text = "";

      let displayReason = reason.replace(/^\.\.\.\s*/, "");
      displayReason =
        displayReason.charAt(0).toLowerCase() + displayReason.slice(1);

      // Determine location text
      let locationText = "Worldwide";
      if (
        typeof window.currentCountry !== "undefined" &&
        window.currentCountry !== "All Countries"
      ) {
        locationText = `In ${window.currentCountry}`;
      } else if (
        typeof window.currentRegion !== "undefined" &&
        window.currentRegion !== "All Regions"
      ) {
        locationText = `In ${window.currentRegion}`;
      }

      if (diff > 0) {
        text = `${locationText}, <span class="font-bold text-purple-300">women show ${diff}% higher</span> acceptance towards domestic violence than men`;
      } else if (diff < 0) {
        text = `${locationText}, <span class="font-bold text-blue-300">men show ${Math.abs(
          diff
        )}% higher</span> acceptance towards domestic violence than women`;
      } else {
        text = `${locationText}, men and women show <span class="font-bold text-gray-300">equal</span> acceptance towards domestic violence`;
      }

      analysisText.innerHTML = text;
    }

    // reasonSelect.addEventListener("change", function () {
    //   updateChart(this.value);
    // });
  });
</script>
