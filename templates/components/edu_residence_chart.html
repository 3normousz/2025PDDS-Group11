<div class="h-full w-full">
  <div class="bg-transparent p-4 font-glacial w-full h-full flex flex-col text-white">
    <div class="flex-1 min-h-0 relative">
      <div id="edu-residence-chart" class="w-full h-full"></div>
    </div>
  </div>
</div>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    fetch("/api/edu-residence?t=" + new Date().getTime())
      .then((response) => response.json())
      .then((traces) => {
        if (traces.error) {
          console.error("Error fetching data:", traces.error);
          return;
        }

        const layout = {
          title: {
            text: "VIOLENCE ACCEPTANCE RATE OF WOMEN WORLDWIDE/IN...",
            font: {
              family: "glacial-indifference, sans-serif",
              size: 14,
              color: "#ffffff",
            },
          },
          xaxis: {
            title: {
              text: "",
              font: {
                family: "glacial-indifference, sans-serif",
                size: 14,
                color: "#ffffff",
              },
            },
            fixedrange: true,
            showgrid: false,
            zeroline: false,
            tickfont: { color: "#ffffff" }
          },
          yaxis: {
            title: {
              text: "",
              font: {
                family: "glacial-indifference, sans-serif",
                size: 14,
                color: "#ffffff",
              },
            },
            range: [0, 80],
            fixedrange: true,
            showgrid: true,
            gridcolor: "#444",
            zeroline: false,
            tickfont: { color: "#ffffff" }
          },
          plot_bgcolor: "rgba(0,0,0,0)",
          paper_bgcolor: "rgba(0,0,0,0)",
          font: {
            family: "glacial-indifference, sans-serif",
            color: "white",
            size: 14
          },
          legend: { 
              title: { text: "" },
              font: { color: "white" }
          },
          margin: { t: 40, r: 20, b: 40, l: 40 },
        };

        const config = {
          displayModeBar: false,
          responsive: true,
        };

        Plotly.newPlot("edu-residence-chart", traces, layout, config);
      })
      .catch((error) => console.error("Error:", error));
  });
</script>
