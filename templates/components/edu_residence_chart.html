<div class="h-full w-full">
  <div class="bg-transparent p-4 font-glacial w-full h-full flex flex-col text-white">
    <div class="flex-none mb-2 pb-2">
        <h2 id="edu-residence-title" class="text-center text-base md:text-lg md:[@media(min-height:800px)]:text-xl font-bold text-white uppercase tracking-wider leading-tight">
            VIOLENCE ACCEPTANCE RATE OF WOMEN WORLDWIDE
        </h2>
    </div>
    <div class="flex-1 min-h-0 relative">
      <div id="edu-residence-chart" class="w-full h-full"></div>
    </div>
  </div>
</div>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    // Initial load
    updateEduResidenceChart(window.currentRegion || "All Regions", window.currentCountry || "All Countries");
  });

  window.updateEduResidenceChart = function(region, country) {
    let url = "/api/edu-residence?t=" + new Date().getTime();
    if (region && region !== "All Regions") url += `&region=${encodeURIComponent(region)}`;
    if (country && country !== "All Countries") url += `&country=${encodeURIComponent(country)}`;

    fetch(url)
      .then((response) => response.json())
      .then((traces) => {
        if (traces.error) {
          console.error("Error fetching data:", traces.error);
          return;
        }

        // Force black text in hover labels for all traces
        traces.forEach(trace => {
            if (!trace.hoverlabel) trace.hoverlabel = {};
            trace.hoverlabel.font = { family: "glacial-indifference, sans-serif", color: "black" };
        });

        // Determine location text
        let locationText = "WORLDWIDE";
        if (country && country !== "All Countries") {
            locationText = `IN ${country.toUpperCase()}`;
        } else if (region && region !== "All Regions") {
            locationText = `IN ${region.toUpperCase()}`;
        }

        // Update HTML title with responsive line break
        const titleElement = document.getElementById('edu-residence-title');
        if (titleElement) {
            titleElement.innerHTML = `VIOLENCE ACCEPTANCE RATE OF WOMEN <br class="block md:hidden" />${locationText}`;
        }

        const sizes = getEduResChartSizes();
        
        const layout = {
          xaxis: {
            title: {
              text: "",
              font: {
                family: "glacial-indifference, sans-serif",
                size: sizes.axisTitle,
                color: "#ffffff",
              },
            },
            fixedrange: true,
            showgrid: false,
            zeroline: false,
            tickfont: { color: "#ffffff" },
            tickprefix: "<b>",
            ticksuffix: "</b>",
            ticks: "outside",
            ticklen: 10,
            tickcolor: "rgba(0,0,0,0)"
          },
          yaxis: {
            title: {
              text: "",
              font: {
                family: "glacial-indifference, sans-serif",
                size: sizes.axisTitle,
                color: "#ffffff",
              },
            },
            range: [0, 50],
            fixedrange: true,
            showgrid: true,
            gridcolor: "#444",
            zeroline: false,
            tickfont: { color: "#ffffff" },
            tickprefix: "<b>",
            ticksuffix: "</b>"
          },
          plot_bgcolor: "rgba(0,0,0,0)",
          paper_bgcolor: "rgba(0,0,0,0)",
          font: {
            family: "glacial-indifference, sans-serif",
            color: "white",
            size: sizes.tickText
          },
          legend: { 
              title: { text: "" },
              font: { color: "white" }
          },
          hoverlabel: {
            font: {
                color: "black",
            }
          },
          margin: { t: sizes.marginTop, r: 20, b: 40, l: 40 },
        };

        const config = {
          displayModeBar: false,
          responsive: true,
        };

        Plotly.newPlot("edu-residence-chart", traces, layout, config);
      })
      .catch((error) => console.error("Error:", error));
  };

  function getEduResChartSizes() {
        const width = window.innerWidth;
        const isSmall = width < 768;
        const isMedium = width < 1024;
        
        return {
            axisTitle: isSmall ? 10 : (isMedium ? 12 : 14),
            tickText: isSmall ? 10 : 12
        };
    }

    window.addEventListener('resize', function() {
        const sizes = getEduResChartSizes();
        const updateLayout = {
            'xaxis.title.font.size': sizes.axisTitle,
            'yaxis.title.font.size': sizes.axisTitle,
            'font.size': sizes.tickText
        };
        Plotly.relayout('edu-residence-chart', updateLayout);
    });
</script>
