<div class="flex h-full w-full max-w-full mx-auto px-4 md:px-0">
    <div class="bg-white p-2 md:p-4 mb-2 font-glacial border-2 border-purple-800 w-full">
        <div class="mb-8 border-b-2 border-gray-200 pb-4">
            <h2 class="text-xl md:text-2xl font-bold text-purple-800 uppercase tracking-wider">
                Cause/Factor on Violence Acceptance
            </h2>
        </div>
        <div id="impact-chart" class="w-full h-[500px]"></div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        let impactData = {};

        // Fetch data
        fetch('/api/impact-data')
            .then(response => response.json())
            .then(data => {
                impactData = data;
                renderChart('Worldwide');
                
                // Listen for country changes from the global dropdown
                window.updateImpactChart = function(country) {
                    renderChart(country);
                };
            });

        function renderChart(country) {
            const data = impactData[country] || impactData['Worldwide'];
            if (!data) return;

            const trace = {
                x: data.impact,
                y: data.demo_question,
                type: 'bar',
                orientation: 'h',
                marker: {
                    color: data.color
                }
            };

            const layout = {
                title: {
                    text: '',
                    font: { size: 24, color: "#7C2AE8", family: "glacial-indifference, sans-serif" }
                },
                margin: { t: 20, r: 20, b: 40, l: 100 },
                xaxis: {
                    showgrid: true,
                    gridcolor: "#E0E0E0",
                    title: "",
                    fixedrange: true
                },
                yaxis: {
                    autorange: "reversed",
                    title: "",
                    fixedrange: true,
                    automargin: true,
                    ticksuffix: "  "
                },
                font: {
                    family: "glacial-indifference, sans-serif",
                    color: "black",
                    size: 14
                },
                plot_bgcolor: "white",
                showlegend: false,
                autosize: true
            };

            const config = { responsive: true, displayModeBar: false };

            Plotly.newPlot('impact-chart', [trace], layout, config);
        }
    });
</script>
