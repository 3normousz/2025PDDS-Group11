<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="{{ url_for('static', filename='src/output.css') }}"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>

  <body class="bg-white">
    <!-- Hook Bar -->
    <div class="">
      <h1 class="text-4xl font-bold">{% block hook %}{% endblock %}</h1>
    </div>

    <!-- Dropdown Btns -->
    <div class="flex justify-center gap-4 mb-6">
      {% block dropdowns %}{% endblock %}
    </div>

    <!-- Content Grid -->
    <div class="grid grid-cols-[repeat(auto-fit,minmax(300px,1fr))] gap-2">
      {% block content %}{% endblock %}
    </div>
  </body>
</html>
